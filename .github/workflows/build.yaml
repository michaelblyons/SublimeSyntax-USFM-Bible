name: Build
on:
  pull_request:
    paths:
      - '.github/workflows/build.yaml'
      - '**.sublime-syntax'
      - '**/syntax_test_*'
      - '**.tmPreferences'
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/build.yaml'
      - '**.sublime-syntax'
      - '**/syntax_test_*'
      - '**.tmPreferences'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install SBNF
        uses: baptiste0928/cargo-install@v3.4.0
        with:
          crate: sbnfc

      - name: Compile syntax file
        run: sbnf usfm.sbnf

      - name: Save syntax file
        uses: actions/upload-artifact@v7
        with:
          name: 'syntaxes.zip'
          path: '*.sublime-syntax'
          retention-days: 1
          if-no-files-found: error

      - name: Create ST package
        run: zip 'USFM Bible.sublime-package' *.md *.tmPreferences *.sublime-syntax

      - name: Upload ST package
        uses: actions/upload-artifact@v7
        with:
          path: 'USFM Bible.sublime-package'
          archive: false
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - build: 'latest'
          - build: 'stable'
          - build: 4077  # `version: 2` support

    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: 'syntaxes.zip'
      - run: ls -R

      - name: Run syntax tests (${{ matrix.build }})
        uses: SublimeText/syntax-test-action@v2
        with:
          build: ${{ matrix.build }}
          package_name: 'USFM Bible'
