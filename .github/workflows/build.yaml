name: Build
on:
  pull_request:
    paths:
      - '.github/workflows/build.yaml'
      - '**.sublime-syntax'
      - '**/syntax_test_*'
      - '**.tmPreferences'
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/build.yaml'
      - '**.sublime-syntax'
      - '**/syntax_test_*'
      - '**.tmPreferences'
  workflow_dispatch:

env:
  PKG_NAME: 'USFM Bible'
  PKG_FILE: 'USFM Bible.sublime-package'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install SBNF
        uses: baptiste0928/cargo-install@v3.4.0
        with:
          crate: sbnfc

      - name: Compile syntax file
        run: sbnf usfm.sbnf

      - name: Save syntax file
        uses: actions/upload-artifact@v7
        with:
          name: 'syntaxes.zip'
          path: '*.sublime-syntax'
          retention-days: 1
          if-no-files-found: error

      - name: Create ST package
        run: zip '${{ env.PKG_FILE }}' *.md *.tmPreferences *.sublime-syntax

      - name: Upload ST package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PKG_FILE }}
          archive: false
          if-no-files-found: error

  syntax-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - build: 'latest'
          - build: 'stable'
          - build: 4077  # `version: 2` support

    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: 'syntaxes.zip'
      - run: ls -R

      - name: Run syntax tests (${{ matrix.build }})
        uses: SublimeText/syntax-test-action@v2
        with:
          build: ${{ matrix.build }}
          package_name: ${{ env.PKG_NAME }}

  package-review:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          name: 'syntaxes.zip'

      - name: Review this package repository
        uses: kaste/st_package_reviewer/gh_action_package@ad89510c574e97d92cfd4d9e0f5c9029394f5c94
        with:
          package-name: ${{ env.PKG_NAME }}
